services:
  # ----------------------------------------------------
  # GPT4Free Proxy - Free OpenAI-Compatible API
  # ----------------------------------------------------
  g4f:
    image: hlohaus789/g4f:latest
    container_name: g4f_api
    restart: always
    ports:
      - "8080:8080"
      - "1337:1337"
    volumes:
      - ./har_and_cookies:/app/har_and_cookies
      - ./generated_media:/app/generated_media
    shm_size: '2g'

  # ----------------------------------------------------
  # OpenHands Agent - AI Software Engineer
  # ----------------------------------------------------
  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands_agent
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WORKSPACE_BASE=${WORKSPACE_BASE:-./workspace}
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main
      - LOG_ALL_EVENTS=true
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Required to spawn sibling sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount local workspace
      - ${WORKSPACE_BASE:-./workspace}:/opt/workspace_base
      # Store state
      - openhands-state:/.openhands-state
    depends_on:
      - g4f

  # ----------------------------------------------------
  # OpenClaw Gateway - Messenger Integration
  # ----------------------------------------------------
  openclaw:
    # Use official image if available, otherwise build from source if needed.
    # We will assume a standard containerized setup for OpenClaw.
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw_gateway
    restart: always
    ports:
      - "8081:8080" # Mapped to 8081 to avoid conflict with g4f
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENHANDS_API_URL=${OPENHANDS_API_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - openhands
      - db
      - redis

  # ----------------------------------------------------
  # PostgreSQL + pgvector - Database and Vector Store
  # ----------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Redis - Cache and Message Queue
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  openhands-state:
