services:
  # ----------------------------------------------------
  # LiteLLM Proxy - Native ChatGPT OAuth Gateway
  # ----------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/chatgpt-auth:/app/chatgpt-auth
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CHATGPT_TOKEN_DIR=/app/chatgpt-auth
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2" ]
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # OpenHands Agent - AI Software Engineer
  # ----------------------------------------------------
  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands_agent
    restart: always
    ports:
      - "2999:3000"
    environment:
      - WORKSPACE_BASE=${WORKSPACE_BASE:-./workspace}
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main
      - LOG_ALL_EVENTS=true
      - LLM_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_BASE_URL=http://litellm:4000
      - LLM_MODEL=${LLM_MODEL:-chatgpt/gpt-5.4}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    deploy:
      resources:
        limits:
          memory: 1280M # Dialokasikan sedikit lebih kecil agar muat adapter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_BASE:-./workspace}:/opt/workspace_base
      - openhands-state:/.openhands-state
    depends_on:
      - litellm

  # ----------------------------------------------------
  # OpenClaw Gateway - Messenger Integration
  # ----------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw_gateway
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENHANDS_API_URL=http://openhands:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - openhands
      - db
      - redis

  # ----------------------------------------------------
  # PostgreSQL + pgvector - Database and Vector Store
  # ----------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    restart: always
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Redis - Cache and Message Queue
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redisdata:/data
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  openhands-state:
