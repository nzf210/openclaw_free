services:
  # ----------------------------------------------------
  # OpenClaw Gateway - Messenger Integration + Pi Agent
  # ----------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw_gateway
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_OPTIONS=--max-old-space-size=1536
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - REDIS_URL=redis://redis:6379
      # API Keys for Fallback Providers
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Pi Coding Agent Configuration
      - AC_PI_CODING_AGENT_ENABLED=${AC_PI_CODING_AGENT_ENABLED}
      - AC_PI_CODING_AGENT_MODEL=${AC_PI_CODING_AGENT_MODEL:-chatgpt:default}
      - AC_PI_CODING_AGENT_FALLBACK_MODEL=${AC_PI_CODING_AGENT_FALLBACK_MODEL}
      - AC_PI_CODING_AGENT_SANDBOX_IMAGE=${AC_PI_CODING_AGENT_SANDBOX_IMAGE}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/home/node/.openclaw/workspace
      - openclaw_data:/home/node/.openclaw
    depends_on:
      - db
      - redis

  # ----------------------------------------------------
  # PostgreSQL + pgvector - Database and Vector Store
  # ----------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    restart: always
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------
  # Redis - Cache and Message Queue
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redisdata:/data
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  openclaw_data:
