model_list:
  # Rute ke ChatGPT OAuth Adapter lokal
  - model_name: openai/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: "http://oauth_adapter:8080/v1"
      api_key: "dummy-key-for-oauth"
  
  # Cadangan: Rute ke Gemini (Jika ChatGPT Adapter Down)
  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
